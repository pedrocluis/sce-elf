name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The wordlists are hashed by build.rs into a table the tests assert
      # round-trips. Building with none of them present catches any accidental
      # dependence on a name that happens to be bundled.
      - name: Build with no bundled wordlists
        run: |
          mkdir -p /tmp/empty-names
          mv sce-elf/names/*.txt /tmp/empty-names/
          cargo build -p sce-elf
          mv /tmp/empty-names/*.txt sce-elf/names/
