[package]
name = "nidscan"
version = "0.1.0"
edition = "2024"
description = "CLI to inspect PS4/PS5 SELF/ELF binaries and hash symbol names to NIDs"
license = "MIT OR Apache-2.0"

[dependencies]
sce-elf = { path = "../sce-elf", version = "0.1" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
